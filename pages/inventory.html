<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/chassis.css">
    <link rel="stylesheet" href="../css/cases-inventory.css">
    <title>Инвентарь | BETTER-X</title>
    <link rel="icon" href="../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <ul>
            <li id="web-name">
                <a href="../index.html"><img src="../img/logo.png" alt="logo" id="web-logo">BETTER-X</a>
            </li>
            <li class="nav-center">
                <a href="inventory.html" class="active"><img src="../img/inventory.png" alt="inventory">Инвентарь</a>
            </li>
            <li id="balance">Баланс: <span id="bal-header">0.00</span> ₽</li>
            <li id="refill"><a href="#" id="depBtn">Пополнение</a></li>
        </ul>
    </header>

    <div id="dep-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999;"></div>
    <div id="dep-block" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgb(30, 30, 30); padding: 30px; border-radius: 12px; border: 3px solid orange; z-index: 1000; width: 400px; box-shadow: 0 0 40px rgba(255, 165, 0, 0.3);">
        <h3 style="color: orange; text-align: center; margin-bottom: 20px; font-size: 24px;">Пополнение баланса</h3>
        <input type="number" placeholder="Сумма, руб" id="depAmount" min="10" max="100000">
        <input type="text" placeholder="Номер карты" id="cardNumber" maxlength="19">
        <input type="text" placeholder="CVV-код" id="cardCvv" maxlength="3">
        <input type="text" placeholder="Срок действия (MM/YY)" id="cardExpiry" maxlength="5">
        <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 20px;">
            <button id="confirmDepBtn" style="background: linear-gradient(45deg, #ff7e33, #ffb400); color: black; padding: 10px; border: none; border-radius: 6px; width: 48%; cursor: pointer; font-weight: bold;">Пополнить</button>
            <button id="closeDepBtn" style="background: #555; color: white; padding: 10px; border: none; border-radius: 6px; width: 48%; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <main>
        <div id="m-inventory" style="display: block; opacity: 1; transform: none; margin: 20px auto; max-width: 1400px; height: auto;">
            <h1>Инвентарь</h1>
            <div id="m-inf-inv">
                <p>Общая стоимость: <span id="rub">0</span>₽</p>
            </div>
        </div>
    </main>

    <script src="../js/deposit.js"></script>
    <script src="../js/inventory.js"></script>
</body>

</html>
